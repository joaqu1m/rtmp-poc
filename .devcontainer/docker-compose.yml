version: '3.8'
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/go:1-1.23-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dbpass
      MYSQL_DATABASE: mydb
      MYSQL_USER: root
      MYSQL_PASSWORD: dbpass
    ports:
      - 3306:3306
